spring.application.name=task-tracker

# --- MySQL connection (override with env vars in production) ---
spring.datasource.url=jdbc:mysql://localhost:3306/task_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA creates/updates tables from the entities on startup. schema.sql is kept alongside
# as the documented reference schema (per assignment requirement) and matches this mapping.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
